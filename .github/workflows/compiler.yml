name: Compiler

on:
  push:
    branches: [main]
    paths:
      - "compiler/**"
      - ".github/workflows/compiler.yml"
    tags:
      - "compiler/*"
  pull_request:
    paths:
      - "compiler/**"
      - ".github/workflows/compiler.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    working-directory: compiler

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nyx.Compiler.slnx

      - name: Build
        run: dotnet build Nyx.Compiler.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Nyx.Compiler.slnx --no-build --configuration Release

  publish:
    name: Publish (${{ matrix.rid }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read the compiler version
        id: version
        run: echo "version=$(dotnet msbuild Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      - name: Check that a release tag matches the compiler version
        if: startsWith(github.ref, 'refs/tags/compiler/')
        run: |
          tag="${GITHUB_REF_NAME#compiler/}"
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag version $tag does not match the Version in NanyxCompiler.Cli.csproj (${{ steps.version.outputs.version }})" >&2
            exit 1
          fi

      # One self-contained, single-file executable per platform, so users need no .NET runtime.
      - name: Publish
        run: >
          dotnet publish Nanyx.Compiler.Cli/NanyxCompiler.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          --output publish/${{ matrix.rid }}

      # The referenced F# projects are executables too, so publish copies their
      # runtimeconfig files alongside the real binary; drop those and the XML docs.
      - name: Remove files that are not part of the binary
        run: rm -f publish/${{ matrix.rid }}/*.runtimeconfig.json publish/${{ matrix.rid }}/*.xml

      - name: Smoke test the published binary
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/nanyx
          ./publish/linux-x64/nanyx --help

      - name: Package
        id: package
        run: |
          name="nanyx-${{ steps.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              (cd publish/${{ matrix.rid }} && zip -r "../../dist/$name.zip" .)
              echo "file=compiler/dist/$name.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              chmod +x publish/${{ matrix.rid }}/nanyx
              tar -czf "dist/$name.tar.gz" -C publish/${{ matrix.rid }} .
              echo "file=compiler/dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-${{ matrix.rid }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  release:
    name: Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/compiler/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nanyx-*
          path: dist
          merge-multiple: true

      - name: Attach the binaries to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Compiler ${{ needs.publish.outputs.version }}
          files: dist/*
          generate_release_notes: true
