name: VS Code extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - "!extension/**/*.md"
      - ".github/workflows/extension.yml"
  # No path filter: "Build and package" is a required check on main, so every PR must run it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: extension

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Read the extension version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npx --yes @vscode/vsce@4 package --out "nanyx-${{ steps.version.outputs.version }}.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: nanyx-vsix
          path: extension/nanyx-*.vsix
          if-no-files-found: error

  # Merging a version bump is the release: main publishes the package it just built as
  # extension/<version>, unless that tag already exists. Nothing is rebuilt for a release.
  publish:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Queue rather than race, so a second push of the same version sees the first one's tag.
    concurrency:
      group: extension-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write   # lets the job request the GitHub OIDC token that Marketplace trusted publishing exchanges
    env:
      TAG: extension/${{ needs.build.outputs.version }}
    steps:
      - name: Check whether this version is already released
        id: check
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        if: steps.check.outputs.release == 'true'
        with:
          name: nanyx-vsix
          path: extension

      # Trusted publishing: no secret is stored. The `nanyx` Marketplace publisher
      # has a policy naming this repository and this workflow file (and no
      # environment, so none is set here), and vsce exchanges the job's OIDC
      # token for a short-lived Marketplace credential.
      - name: Publish to the Visual Studio Marketplace
        if: steps.check.outputs.release == 'true'
        run: npx --yes @vscode/vsce@4 publish --oidc --packagePath nanyx-${{ needs.build.outputs.version }}.vsix

      - name: Publish to Open VSX
        if: steps.check.outputs.release == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish nanyx-${{ needs.build.outputs.version }}.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Tag the commit and attach the package to a GitHub release
        if: steps.check.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: VS Code extension ${{ needs.build.outputs.version }}
          files: extension/nanyx-${{ needs.build.outputs.version }}.vsix
          generate_release_notes: true
